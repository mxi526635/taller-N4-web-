<!DOCTYPE html>
<html lang="es">
<head>

    <title>Ejemplo CSS # 2</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <nav class="nav-menu">
        <a href="index.html">Menú Principal</a>
        <a href="ejercicio1.html">Opción 1</a>

    <main class="layouts-container">
        <h1 class="layouts-title">Beautiful, Hand-crafted Layouts</h1>

        <div class="layouts-grid">
            <div class="layout-item">
                <img src="imagenes/real_estate.jpg" alt="Real Estate">
                <p class="layout-label">Real Estate</p>
            </div>

            <div class="layout-item">
                <img src="imagenes/library.jpg" alt="Library">
                <p class="layout-label">Library</p>
            </div>

            <div class="layout-item">
                <img src="imagenes/transportation.jpg" alt="Transportation">
                <p class="layout-label">Transportation</p>
            </div>

            <div class="layout-item">
                <img src="imagenes/gas_oil.jpg" alt="Gas & Oil">
                <p class="layout-label">Gas &amp; Oil</p>
            </div>

            <div class="layout-item">
                <img src="imagenes/marketing_agency.jpg" alt="Marketing Agency">
                <p class="layout-label">Marketing Agency</p>
            </div>

            <div class="layout-item">
                <img src="imagenes/pizza.jpg" alt="Pizza">
                <p class="layout-label">Pizza</p>
            </div>

            <div class="layout-item">
                <img src="imagenes/flooring.jpg" alt="Flooring">
                <p class="layout-label">Flooring</p>
            </div>

            <div class="layout-item">
                <img src="imagenes/steel_processing.jpg" alt="Stool Processing">
                <p class="layout-label">Stool Processing</p>
            </div>

            <div class="layout-item">
                <img src="imagenes/coming_soon.jpg" alt="Coming Soon">
                <p class="layout-label">Coming Soon</p>
            </div>
        </div>
    </main>
